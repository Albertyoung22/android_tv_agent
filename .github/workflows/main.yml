name: Build Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案代碼
      uses: actions/checkout@v4

    - name: 安裝 Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 設定 Android SDK
      uses: android-actions/setup-android@v3

    - name: 授權與安裝 Android SDK 33
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-33" "build-tools;33.0.2"

    - name: 安裝 Gradle 7.6.4
      run: |
        wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -O /tmp/gradle.zip
        sudo unzip -q -d /opt/gradle /tmp/gradle.zip
        echo "/opt/gradle/gradle-7.6.4/bin" >> $GITHUB_PATH

    - name: 編譯 APK
      run: |
        gradle assembleDebug --stacktrace

    - name: 上傳 APK 產物
      uses: actions/upload-artifact@v4
      with:
        name: MbcastTvAgent-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
