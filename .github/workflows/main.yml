name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}
    - uses: android-actions/setup-android@v3
    - uses: gradle/actions/setup-gradle@v4
      with: {gradle-version: '7.6.4'}
    - run: sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml && gradle assembleDebug
    - uses: actions/upload-artifact@v4
      with: {name: MbcastTvAgent-APK, path: app/build/outputs/apk/debug/app-debug.apk}
