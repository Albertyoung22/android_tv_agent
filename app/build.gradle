apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.relaybell.mbcast"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 23
        versionName "2.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 純原生 Android API，零外部重型依賴庫，保證老舊電視 (Android 4.4~14) 皆可順暢運作
}
